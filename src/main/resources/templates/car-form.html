<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoCare — Add Vehicle</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:       #0a0f1e;
            --surface:  rgba(255,255,255,0.05);
            --border:   rgba(255,255,255,0.10);
            --purple:   #8b5cf6;
            --purple-d: #7c3aed;
            --orange:   #f97316;
            --text:     #f1f5f9;
            --muted:    #94a3b8;
        }

        body {
            background: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── NAVBAR ── */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
            background: rgba(10,15,30,0.85);
        }
        .brand { font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: 0.5rem; text-decoration: none; }
        .brand i { color: var(--orange); }
        .brand span { background: linear-gradient(135deg, var(--purple), var(--orange)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .btn {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.82rem;
            font-weight: 600; cursor: pointer; transition: all 0.2s;
            border: none; text-decoration: none; font-family: inherit;
        }
        .btn-primary { background: var(--purple); color: #fff; }
        .btn-primary:hover { background: var(--purple-d); color: #fff; transform: translateY(-1px); }
        .btn-outline { background: transparent; color: var(--muted); border: 1px solid var(--border); }
        .btn-outline:hover { border-color: var(--purple); color: var(--text); }
        .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.78rem; }

        /* ── CENTER CONTENT ── */
        .center-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* ── FORM CARD ── */
        .form-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 20px;
            backdrop-filter: blur(12px);
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
            animation: fadeUp 0.35s ease;
        }

        .form-card-header { text-align: center; margin-bottom: 2rem; }
        .icon-wrap {
            width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 1rem;
            background: linear-gradient(135deg, rgba(139,92,246,0.25), rgba(249,115,22,0.15));
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; color: var(--purple);
        }
        .form-card-header h1 { font-size: 1.4rem; font-weight: 800; }
        .form-card-header p { font-size: 0.82rem; color: var(--muted); margin-top: 0.25rem; }

        /* ── FORM FIELDS ── */
        .form-group { margin-bottom: 1.1rem; }
        label {
            display: block; font-size: 0.75rem; font-weight: 600;
            color: var(--muted); margin-bottom: 0.4rem;
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        .input-wrap { position: relative; }
        .input-wrap i {
            position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%);
            color: var(--muted); font-size: 0.85rem; pointer-events: none;
        }
        input {
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            color: var(--text); border-radius: 8px; padding: 0.65rem 0.85rem 0.65rem 2.2rem;
            font-size: 0.88rem; font-family: inherit; transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            outline: none; border-color: var(--purple);
            box-shadow: 0 0 0 3px rgba(139,92,246,0.15);
        }
        input::placeholder { color: rgba(148,163,184,0.5); }

        .submit-btn {
            width: 100%; margin-top: 0.5rem;
            padding: 0.75rem; font-size: 0.95rem;
            justify-content: center;
        }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav>
    <a href="/" class="brand">
        <i class="fa-solid fa-car-wrench"></i>
        <span>AutoCare</span>
    </a>
    <a href="/" class="btn btn-outline btn-sm"><i class="fa-solid fa-arrow-left"></i> Back to Garage</a>
</nav>

<div class="center-wrap">
    <div class="form-card">
        <div class="form-card-header">
            <div class="icon-wrap"><i class="fa-solid fa-car-on"></i></div>
            <h1>Add New Vehicle</h1>
            <p>Register your car to start tracking service reminders</p>
        </div>

        <form th:action="@{/car}" th:object="${car}" method="post">
            <div class="form-group">
                <label>Vehicle Make</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-industry"></i>
                    <input type="text" th:field="*{make}" placeholder="e.g. Toyota, BMW, Porsche" required>
                </div>
            </div>
            <div class="form-group">
                <label>Vehicle Model</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-tag"></i>
                    <input type="text" th:field="*{model}" placeholder="e.g. Camry, 3 Series, 911" required>
                </div>
            </div>
            <div class="form-group">
                <label>Manufacture Year</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-calendar"></i>
                    <input type="number" th:field="*{year}" placeholder="e.g. 2022" min="1900" max="2030" required>
                </div>
            </div>
            <div class="form-group">
                <label>Registration Plate</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-hashtag"></i>
                    <input type="text" th:field="*{registrationNumber}" placeholder="e.g. ABC-1234" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary submit-btn" id="save-vehicle-btn">
                <i class="fa-solid fa-floppy-disk"></i> Save Vehicle
            </button>
        </form>
    </div>
</div>

</body>
</html>
