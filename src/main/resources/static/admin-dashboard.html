<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop Management — Car Management</title>
    <link rel="stylesheet" href="style.css">
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-sheet);
            border: 1px solid var(--border-light);
            margin-top: 40px;
            border-radius: 12px;
            overflow: hidden;
        }

        th {
            text-align: left;
            padding: 16px 24px;
            background: #F9F8F6;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-light);
        }

        td {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-light);
            font-size: 14px;
        }

        .btn-pill {
            padding: 6px 16px;
            font-size: 11px;
            font-weight: 700;
            background: white;
            border: 1px solid var(--border-light);
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .btn-pill:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
    </style>
</head>
<body>

<div class="dashboard-layout">
    <aside class="sidebar">
        <div style="margin-bottom: 48px;">
            <h1 style="font-size: 24px; color: var(--text-dark);">Car Management</h1>
            <p style="font-size: 10px; font-weight: 700; color: var(--accent-warm); letter-spacing: 0.1em; margin-top: 4px;">MANAGEMENT</p>
        </div>

        <nav>
            <a href="#" class="nav-link active">Our Customers</a>
            <a href="#" class="nav-link" onclick="alert('Coming soon')">Service Calendar</a>
            <a href="#" class="nav-link" onclick="alert('Coming soon')">Workshop Notes</a>
        </nav>

        <div style="margin-top: auto;">
            <button class="nav-link" style="background:none; border:none; width:100%; text-align:left; cursor:pointer;" onclick="logout()">Sign Out</button>
        </div>
    </aside>

    <main class="main-content">
        <header style="margin-bottom: 60px;">
            <h2 style="font-size: 36px;">The Community</h2>
            <p style="color: var(--text-slate); margin-top: 8px;">Helping our neighbors keep their cars in peak condition.</p>
        </header>

        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;">
            <div class="stat-card">
                <p style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Total Neighbors</p>
                <div id="totalUsers" style="font-size: 32px; font-weight: 700; margin-top: 8px;">0</div>
            </div>
            <div class="stat-card">
                <p style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Team Members</p>
                <div id="totalAdmins" style="font-size: 32px; font-weight: 700; margin-top: 8px;">0</div>
            </div>
            <div class="stat-card">
                <p style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Workshop Pulse</p>
                <div style="font-size: 32px; font-weight: 700; margin-top: 8px;">Steady</div>
            </div>
        </div>

        <div style="margin-top: 40px; display: flex; justify-content: space-between; align-items: center;">
            <h3 style="font-size: 20px;">Neighbor Registry</h3>
            <div style="position: relative; width: 300px;">
                <input type="text" id="searchInput" class="input-field" style="padding-left: 40px; border-bottom: 1px solid var(--border-light);" placeholder="Search by name or email...">
                <span style="position: absolute; left: 10px; top: 12px; opacity: 0.5;">🔍</span>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Neighbor</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="userTable"></tbody>
        </table>
    </main>
</div>

<script src="app.js"></script>
<script>
    requireAdmin();
    let allUsers = [];

    async function loadUsers() {
      try {
        const res = await fetch(`${API_BASE}/users`);
        allUsers = await res.json();

        document.getElementById('totalUsers').textContent   = allUsers.length;
        document.getElementById('totalAdmins').textContent  = allUsers.filter(u => u.role === 'ADMIN').length;

        renderTable(allUsers);
      } catch (e) {
          console.error('Failed to load customers', e);
      }
    }

    function renderTable(users) {
        const tbody = document.getElementById('userTable');
        tbody.innerHTML = users.map(u => `
            <tr>
                <td><span style="font-weight:700;">${u.name}</span></td>
                <td>${u.email}</td>
                <td><span style="font-size:12px; color:var(--text-slate); font-weight:600;">${u.role}</span></td>
                <td>
                    <button class="btn-pill" onclick="changeRole(${u.id}, '${u.role === 'USER' ? 'ADMIN' : 'USER'}')">
                        ${u.role === 'USER' ? 'Promote' : 'Demote'}
                    </button>
                    <button class="btn-pill" style="color: #B91C1C; border-color: rgba(185, 28, 28, 0.1);" onclick="deleteUser(${u.id})">Remove</button>
                </td>
            </tr>
        `).join('');
    }

    // Search logic
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = allUsers.filter(u => 
            u.name.toLowerCase().includes(term) || 
            u.email.toLowerCase().includes(term)
        );
        renderTable(filtered);
    });

    async function changeRole(id, newRole) {
      if (!confirm(`Update role to ${newRole}?`)) return;
      const res = await fetch(`${API_BASE}/users/${id}/role?role=${newRole}`, { method: 'PUT' });
      if (res.ok) loadUsers();
    }

    async function deleteUser(id) {
      if (!confirm('Permanently remove this person from the registry?')) return;
      await fetch(`${API_BASE}/users/${id}`, { method: 'DELETE' });
      loadUsers();
    }

    loadUsers();
</script>
</body>
</html>
