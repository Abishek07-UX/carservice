<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — CarService Pro</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            padding: 48px;
            background: white;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-header h2 {
            font-size: 28px;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .btn-primary {
            width: 100%;
            margin-top: 8px;
        }

        .msg {
            margin-top: 16px;
            font-size: 14px;
            min-height: 20px;
            text-align: center;
        }

        .error-msg { color: var(--error); }
        .success-msg { color: var(--success); }

        .footer-links {
            margin-top: 32px;
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="auth-card glass-card animate-fade-in">
    <div class="auth-header">
        <h2>Create Account</h2>
        <p>Join the future of fleet management.</p>
    </div>
    
    <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" class="form-control" placeholder="John Doe">
    </div>
    
    <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="name@company.com">
    </div>
    
    <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="text" id="phone" class="form-control" placeholder="+1 (555) 000-0000">
    </div>
    
    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••">
    </div>
    
    <button class="btn-primary" onclick="register()">Create Account</button>
    
    <div id="msg" class="msg"></div>
    
    <div class="footer-links">
        Already have an account? <a href="index.html">Sign in here</a>
    </div>
</div>

<script src="app.js"></script>
<script>
    async function register() {
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('msg');

      if (!name || !email || !password) {
        msg.textContent = 'Name, email, and password are required!';
        msg.className = 'msg error-msg';
        return;
      }

      const user = { name, email, phone, password };

      try {
        const res = await fetch(`${API_BASE}/users/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(user)
        });

        if (res.ok) {
          msg.textContent = 'Account created! Redirecting to login...';
          msg.className = 'msg success-msg';
          setTimeout(() => window.location.href = 'index.html', 1500);
        } else {
          msg.textContent = 'Registration failed. Please try again.';
          msg.className = 'msg error-msg';
        }
      } catch (error) {
        msg.textContent = 'Connection error. Is the server running?';
        msg.className = 'msg error-msg';
      }
    }
</script>
</body>
</html>
