<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — AutoCare Pro</title>
    <meta name="description" content="Create your AutoCare Pro account to book car services and track maintenance history.">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="ambient-bg"></div>
<div class="grid-pattern"></div>

<div class="viewport-center">
    <div class="auth-sheet animate-fade" style="max-width: 480px; width: 100%;">
        <div style="text-align: center; margin-bottom: 32px;">
            <div style="display: inline-flex; align-items: center; gap: 10px; margin-bottom: 24px;">
                <div style="width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent-deep)); display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 6px 20px rgba(255,107,44,0.3);">🔧</div>
                <span style="font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 800;">AutoCare Pro</span>
            </div>
            <h2 style="font-size: 28px; margin-bottom: 8px;">Create Account</h2>
            <p style="color: var(--text-muted); font-size: 14px;">Join the future of car maintenance management.</p>
        </div>

        <div class="form-group">
            <label class="form-label" for="name">Full Name</label>
            <input type="text" id="name" class="input-field" placeholder="John Doe">
        </div>

        <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" class="input-field" placeholder="you@example.com">
        </div>

        <div class="form-group">
            <label class="form-label" for="phone">Phone Number</label>
            <input type="tel" id="phone" class="input-field" placeholder="+91 98765 43210">
        </div>

        <div class="form-group" style="margin-bottom: 32px;">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="input-field" placeholder="••••••••">
        </div>

        <button class="btn-primary" id="registerBtn" onclick="register()">🚗 Create Account</button>

        <div id="msg" class="msg"></div>

        <div style="margin-top: 28px; text-align: center; font-size: 14px; color: var(--text-secondary);">
            Already have an account? <a href="index.html" class="link-btn">Sign in here</a>
        </div>
    </div>
</div>

<script src="app.js"></script>
<script>
    async function register() {
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const password = document.getElementById('password').value;
        const msg = document.getElementById('msg');

        if (!name || !email || !phone || !password) {
            msg.textContent = 'All fields are required.';
            msg.className = 'msg error';
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/users/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, phone, password })
            });

            if (res.ok) {
                msg.textContent = '✓ Account created! Redirecting to login...';
                msg.className = 'msg success';
                setTimeout(() => window.location.href = 'index.html', 1500);
            } else {
                msg.textContent = 'Registration failed. Email may already exist.';
                msg.className = 'msg error';
            }
        } catch (error) {
            msg.textContent = 'Connection error. Is the server running?';
            msg.className = 'msg error';
        }
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') register();
    });
</script>
</body>
</html>
